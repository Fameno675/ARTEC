<div class="dropdown">
  <button class="btn btn-sm btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    <i class="bi bi-person-circle me-1" aria-hidden="true"></i><span class="d-none d-md-inline">{{ user.full_name|default:user.email }}</span><span class="d-md-none visually-hidden">Mon compte</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li class="px-3 py-2"><div class="fw-semibold">{{ user.full_name }}</div><div class="small text-muted">{{ user.email }}</div>
      <div class="small mt-1"><span class="ar-badge is-info">{{ user.get_role_display }}</span>{% if user.operator %} <span class="ar-badge is-neutral">{{ user.operator.name }}</span>{% endif %}</div></li>
    <li><hr class="dropdown-divider"></li>
    <li><a class="dropdown-item" href="{% url 'accounts:home_redirect' %}"><i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>Mon espace</a></li>
    <li><a class="dropdown-item" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2" aria-hidden="true"></i>Changer le mot de passe</a></li>
    {% if user.is_staff %}<li><a class="dropdown-item" href="{% url 'admin:index' %}"><i class="bi bi-gear me-2" aria-hidden="true"></i>Administration technique</a></li>{% endif %}
    <li><hr class="dropdown-divider"></li>
    <li><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="dropdown-item" type="submit" data-no-loading><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Se déconnecter</button></form></li>
  </ul>
</div>
