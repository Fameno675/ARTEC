<div class="ar-chart" data-chart="{{ chart|force_escape }}" data-src="{{ src|force_escape }}"{% if points_src %} data-points-src="{{ points_src|force_escape }}"{% endif %} data-granularity="{{ granularity|force_escape }}" data-label="{{ label|force_escape }}" data-labels="{{ labels|force_escape }}" data-parts="{{ parts|force_escape }}" data-series="{{ series_cls|force_escape }}" data-title="{{ title|force_escape }}" data-empty-text="{{ empty_text|force_escape }}" data-index="{{ index|force_escape }}" role="group" aria-label="{{ title|force_escape }}">
  <div class="ar-chart-empty"><span>Le graphique nécessite JavaScript. Le tableau de données équivalent est affiché sur la page.</span></div>
</div>
