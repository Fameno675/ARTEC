{% if form.non_field_errors %}<div class="ar-notice is-danger" role="alert"><i class="bi bi-x-octagon" aria-hidden="true"></i><div>{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div></div>{% endif %}
{% for field in form.visible_fields %}{% include "partials/field.html" with field=field %}{% endfor %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
